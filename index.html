<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UMBRAL — Una experiencia interactiva</title>
<meta name="description" content="Experiencia audiovisual interactiva sobre la identidad digital. Cámara, voz, gestos y filtros en tiempo real.">
<meta name="theme-color" content="#020502">
<style>
@import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap');
*{box-sizing:border-box}
html{background:#020502}
body{margin:0;min-height:100vh;background:#020502;color:#a5ff92;font-family:'Silkscreen','Courier New',monospace;}
.shell{width:min(96vw,1100px);margin:0 auto;padding:22px 0 28px;}
header{text-align:center;margin:0 auto 16px;width:100%;}
h1{margin:0;color:#aeff91;font-weight:700;font-size:clamp(3.5rem,14.2vw,10.8rem);letter-spacing:-.085em;line-height:1.05;text-shadow:0 0 24px #3aff4233;white-space:nowrap;}
.subtitle{display:block;color:#82cd76;font-size:clamp(10px,1.55vw,18px);letter-spacing:.17em;margin-top:12px;}
.screen{margin-top:24px;position:relative;aspect-ratio:16/9;border:1px solid #357b37;background:#020802;box-shadow:0 0 0 4px #071207,0 15px 65px #000;overflow:hidden;}
.screen canvas{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;}
.screen:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(0,0,0,.12) 4px 5px);opacity:.36;}
.tag{position:absolute;top:13px;left:14px;color:#b4ffad;font-size:10px;letter-spacing:.08em;text-shadow:0 1px 4px #000;}
.bottom{display:flex;justify-content:center;gap:9px;align-items:center;margin-top:19px;flex-wrap:wrap;}
button{border:1px solid #438e42;background:#051105;color:#a5ff92;padding:12px 15px;cursor:pointer;font-family:inherit;font-weight:700;letter-spacing:.025em;font-size:10px;}
button:hover,button:focus-visible{background:#153a17;outline:1px solid #6ccf66;}
.meter{width:70px;height:5px;background:#163619;}
.fill{height:100%;width:0;background:#a5ff92;transition:width .08s;}
.tiny{font-size:9px;color:#86b982;}
.status{text-align:center;font-size:9px;color:#7dba76;min-height:18px;line-height:1.7;margin:13px auto;}
.reflection{margin:25px auto 8px;text-align:center;font-size:clamp(12px,2.1vw,20px);color:#a5ff92;letter-spacing:.02em;}
video{display:none}
button{touch-action:manipulation}
.screen canvas{position:absolute;inset:0}
.status{max-width:65ch}
@media (prefers-reduced-motion: reduce){.screen:after{opacity:.15}}
@media(max-width:600px){.shell{width:94vw;padding-top:20px;}h1{font-size:clamp(2.7rem,14vw,6rem)}.screen{aspect-ratio:16/9}.subtitle{letter-spacing:.025em}.bottom{gap:7px}button{padding:11px 9px;font-size:9px;flex:1 1 125px;min-height:44px}.meter{width:56px}.tag{font-size:8px}.status{font-size:8px}.reflection{line-height:1.5}.reflection{margin-top:26px;}}
</style>
</head>
<body>
<main class="shell">
<header><h1>UMBRAL</h1><span class="subtitle">UNA EXPERIENCIA INTERACTIVA</span></header>
<div class="screen"><canvas id="screen" width="640" height="360"></canvas><span class="tag">● REC / TRACKING</span></div>
<div class="bottom">
<button id="start" type="button">▶ INICIAR</button><button id="reset" type="button">↺ REINICIAR</button>
<button id="audio" type="button">MIC: ON</button><button id="simulate" type="button">◉ SIMULAR VOZ</button><button id="beauty" type="button" title="Prueba maquillaje sin mostrar la palma">FILTRO: PALMA</button><button id="fistTest" type="button" title="Prueba la transformación sin mostrar el puño">PUÑO: TEST</button>
<span class="tiny">VOZ</span><div class="meter"><div class="fill" id="fill"></div></div>
<span class="tiny">ROSTRO</span><div class="meter"><div class="fill" id="gestureFill"></div></div>
</div>
<p class="status" id="status">ESPACIO: VOZ · BOCA: OJOS · CABEZA: FANTASMAS · PALMA: BELLEZA · PUÑO: MULTIPLICACIÓN</p>
<p class="reflection">¿Quiénes somos detrás de esa pantalla?</p>
<p class="status">La cámara se procesa en tu dispositivo. No se guardan vídeos en esta página.</p>
<video id="video" autoplay muted playsinline></video>
</main>
<script>
const video=document.getElementById('video');
const canvas=document.getElementById('screen');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
const statusText=document.getElementById('status');
const fill=document.getElementById('fill');
const gestureFill=document.getElementById('gestureFill');
gestureFill.style.background='#68c75f';
let stream, micStream, audioContext, analyser, samples, micOn=true, running=false;
let volume=0, micVolume=0, manualVolume=0, simulandoVoz=false;
let vozSuave=0, bocaSuave=0, movimientoSuave=0, colapsoDuracion=0, maquillajeSuave=0, punioSuave=0;
let beautyManual=false, fistManual=false;
const botonPunio=document.getElementById("fistTest");
botonPunio.onclick=()=>{fistManual=!fistManual;botonPunio.textContent=fistManual?"PUÑO: ACTIVO":"PUÑO: TEST";botonPunio.setAttribute("aria-pressed",String(fistManual));};
const botonBeauty=document.getElementById("beauty");
botonBeauty.onclick=()=>{beautyManual=!beautyManual;botonBeauty.textContent=beautyManual?"FILTRO: FIJO ON":"FILTRO: PALMA";botonBeauty.setAttribute("aria-pressed",String(beautyManual));};
// La voz afecta a la información; los gestos modifican el rostro.

// La barra espaciadora funciona incluso después de pulsar INICIAR.
// Solo ignoramos la tecla si el usuario está escribiendo en un campo de texto.
function teclaEspacio(event){
 const elemento=event.target;
 if (elemento && (elemento.tagName==='INPUT'||elemento.tagName==='TEXTAREA'||elemento.isContentEditable)) return;
 if(event.code==='Space'){
  event.preventDefault();
  simulandoVoz=(event.type==='keydown');
  actualizarIndicador();
 }
}
document.addEventListener('keydown',teclaEspacio);
document.addEventListener('keyup',teclaEspacio);
window.addEventListener('blur',()=>{simulandoVoz=false;actualizarIndicador();});
const botonSimular=document.getElementById('simulate');
function actualizarIndicador(){
 botonSimular.textContent=simulandoVoz?'● VOZ ACTIVA':'◉ SIMULAR VOZ';
 botonSimular.style.borderColor=simulandoVoz?'#a5ff92':'#438e42';
}
// Alternativa para probar sin teclado: mantener pulsado este botón.
botonSimular.addEventListener('pointerdown',e=>{
 e.preventDefault();botonSimular.setPointerCapture(e.pointerId);
 simulandoVoz=true;actualizarIndicador();
});
for(const tipo of ['pointerup','pointercancel','lostpointercapture']){
 botonSimular.addEventListener(tipo,()=>{simulandoVoz=false;actualizarIndicador();});
}

// Buffer reutilizable para la pixelación (no se crea en cada fotograma).
const buffer=document.createElement('canvas');
buffer.width=320;buffer.height=180;
const b=buffer.getContext('2d');
const caraPixel=document.createElement('canvas');

// Textura pequeña de grano: reutilizamos un canvas para evitar cargar la CPU.
const grano=document.createElement('canvas');grano.width=160;grano.height=90;
const granoCtx=grano.getContext('2d');
let fotogramaGrano=0;
function dibujarGrano(w,h){
 if((fotogramaGrano++%4)===0){
  const imagen=granoCtx.createImageData(160,90);
  for(let i=0;i<imagen.data.length;i+=4){
   const v=Math.floor(Math.random()*150)+55;
   imagen.data[i]=v*.6;imagen.data[i+1]=v;imagen.data[i+2]=v*.6;
   imagen.data[i+3]=Math.floor(Math.random()*28);
  }
  granoCtx.putImageData(imagen,0,0);
 }
 ctx.save();ctx.imageSmoothingEnabled=false;ctx.globalAlpha=.22;
 ctx.drawImage(grano,0,0,w,h);ctx.restore();
}

// Retoque de proporciones con muestreo de imagen.
// Ajustes locales de la imagen:
// contorno, nariz y labios.
// Trabaja sobre una copia del fotograma.
function deformarRostro(puntos, fuerza){
 if(!puntos || fuerza<0.025)return;
 const W=buffer.width,H=buffer.height;
 const coord=(i)=>({x:(1-puntos[i].x)*W,y:puntos[i].y*H});
 const barbilla=coord(152), frente=coord(10), izquierdo=coord(234), derecho=coord(454);
 const centroX=(izquierdo.x+derecho.x)/2;
 const ancho=Math.abs(derecho.x-izquierdo.x);
 const alto=Math.abs(barbilla.y-frente.y);
 if(ancho<25 || alto<35)return;
 const narizIzq=coord(98),narizDer=coord(327),narizCentro=coord(1);
 const bocaIzq=coord(61), bocaDer=coord(291), labioArriba=coord(0), labioAbajo=coord(17);
 const labioCentro={x:(bocaIzq.x+bocaDer.x)/2,y:(labioArriba.y+labioAbajo.y)/2};
 const radioLabiosX=Math.max(7,Math.abs(bocaDer.x-bocaIzq.x)*.63);
 const radioLabiosY=Math.max(5,Math.abs(labioAbajo.y-labioArriba.y)*1.2+2);
 const src=b.getImageData(0,0,W,H);
 const dst=b.createImageData(W,H);dst.data.set(src.data);
 const inRange=(v,a,c)=>Math.exp(-0.5*((v-a)/c)**2);
 const xMin=Math.max(0,Math.floor(Math.min(izquierdo.x,derecho.x)-ancho*.25));
 const xMax=Math.min(W-1,Math.ceil(Math.max(izquierdo.x,derecho.x)+ancho*.25));
 const yMin=Math.max(0,Math.floor(frente.y-9));
 const yMax=Math.min(H-1,Math.ceil(barbilla.y+8));
 // Intensidad intencionadamente moderada: las capas deben parecer un filtro, no un glitch.
 for(let y=yMin;y<=yMax;y++)for(let x=xMin;x<=xMax;x++){
   let sx=x,sy=y;
   // Afinado de ambas mejillas: los pixeles se toman desde el exterior.
   for(const p of [izquierdo,derecho]){
     const haciaCentro=Math.sign(centroX-p.x);
     const nuevaX=p.x+haciaCentro*ancho*.075*fuerza;
     const peso=inRange(x,nuevaX,ancho*.19)*inRange(y,p.y,alto*.32);
     sx-=haciaCentro*ancho*.075*fuerza*peso;
   }
   // Afinado de nariz: disminuye la anchura en la zona de las aletas.
   for(const p of [narizIzq,narizDer]){
     const haciaCentro=Math.sign(narizCentro.x-p.x);
     const nuevaX=p.x+haciaCentro*ancho*.042*fuerza;
     const peso=inRange(x,nuevaX,ancho*.09)*inRange(y,p.y,alto*.14);
     sx-=haciaCentro*ancho*.042*fuerza*peso;
   }
   // Aumento de labios: muestreamos una zona mas pequeña y la expandimos.
   const dx=(x-labioCentro.x)/radioLabiosX,dy=(y-labioCentro.y)/radioLabiosY;
   const dist=dx*dx+dy*dy;
   if(dist<4){
     const peso=Math.exp(-1.15*dist);
     const escala=1+fuerza*.42*peso;
     sx=labioCentro.x+(sx-labioCentro.x)/escala;
     sy=labioCentro.y+(sy-labioCentro.y)/escala;
   }
   // Muestreo bilineal: suaviza los contornos y evita bordes de bloques enormes.
   sx=Math.max(0,Math.min(W-1.001,sx));sy=Math.max(0,Math.min(H-1.001,sy));
   const x0=Math.floor(sx),y0=Math.floor(sy),fx=sx-x0,fy=sy-y0;
   const x1=Math.min(W-1,x0+1),y1=Math.min(H-1,y0+1);
   const i00=(y0*W+x0)*4,i10=(y0*W+x1)*4,i01=(y1*W+x0)*4,i11=(y1*W+x1)*4;
   const o=(y*W+x)*4;
   for(let c=0;c<3;c++){
    const a=src.data[i00+c]*(1-fx)+src.data[i10+c]*fx;
    const z=src.data[i01+c]*(1-fx)+src.data[i11+c]*fx;
    dst.data[o+c]=a*(1-fy)+z*fy;
   }
 }
 b.putImageData(dst,0,0);
}

function draw(){
 requestAnimationFrame(draw);
 const w=canvas.width,h=canvas.height;
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 ctx.fillStyle='#060a12';ctx.fillRect(0,0,w,h);
 // Micrófono y teclado se calculan aunque la cámara aún no esté activa.
 // Micrófono: calcula intensidad sin interferir con el teclado.
 if(analyser&&micOn){
  analyser.getByteTimeDomainData(samples);
  let sum=0;
  for(const sample of samples){const n=(sample-128)/128;sum+=n*n;}
  const rms=Math.sqrt(sum/samples.length);
  micVolume=micVolume*.8+Math.min(1,rms*8)*.2;
 }else{micVolume*=.85;}

 // Barra espaciadora: sube progresivamente hasta el 100%.
 if(simulandoVoz){manualVolume=Math.min(1,manualVolume+0.012);}
 else{manualVolume=Math.max(0,manualVolume-0.017);}
 // VOZ controla solo glitches, notificaciones y sobrecarga.
 const vozObjetivo=Math.max(micVolume,manualVolume);
 vozSuave+=(vozObjetivo-vozSuave)*(vozObjetivo>vozSuave?0.045:0.07);
 volume=vozSuave;
 // ROSTRO controla solo los ojos y la máscara; MOVIMIENTO, los fantasmas.
 const bocaObjetivo=window.gestureIntensity||0;
 const movimientoObjetivo=window.faceMovement||0;
 bocaSuave+=(bocaObjetivo-bocaSuave)*0.09;
 movimientoSuave+=(movimientoObjetivo-movimientoSuave)*0.09;
 fill.style.width=Math.round(volume*100)+'%';
 gestureFill.style.width=Math.round(Math.max(bocaSuave,movimientoSuave)*100)+'%';
 if(!running||video.readyState<2){
  ctx.fillStyle='#92a6c6';ctx.textAlign='center';ctx.font='15px monospace';
  ctx.fillText('AWAITING SIGNAL...',w/2,h/2-14);
  ctx.fillText('VOICE '+String(Math.round(volume*100)).padStart(3,'0')+'%',w/2,h/2+16);
  if(volume>0.25){ctx.fillStyle='#9ebeff';for(let i=0;i<Math.floor(volume*12);i++)ctx.fillRect(Math.random()*w,Math.random()*h,40+Math.random()*80,2+Math.random()*6);}
  return;
 }

 // Cámara reflejada y pixelada.
 b.setTransform(1,0,0,1,0,0);b.clearRect(0,0,320,180);
 b.translate(320,0);b.scale(-1,1);b.drawImage(video,0,0,320,180);
 // El filtro es reversible: retirar la palma devuelve la imagen natural.
 const maquillajeActivo=!!window.palmOpen || beautyManual;
 maquillajeSuave+=(Number(maquillajeActivo)-maquillajeSuave)*0.085;
 if(maquillajeSuave>0.025)deformarRostro(window.faceMakeupPoints,maquillajeSuave);
 ctx.imageSmoothingEnabled=false;ctx.drawImage(buffer,0,0,w,h);
 // Color de monitor antiguo: tinte tenue, sin ocultar la imagen.
 ctx.save();
 ctx.globalCompositeOperation='multiply';ctx.globalAlpha=0.18;
 ctx.fillStyle='#80c68a';ctx.fillRect(0,0,w,h);
 ctx.restore();

 
 // FILTRO A: OJOS ARTIFICIALES (sobre el vídeo reflejado)
 // Las posiciones faciales vienen de MediaPipe en coordenadas 640x360.
 const ojos = window.faceEyes;
 const rostroActual = window.faceBox;
 const intensidad = bocaSuave;
 if (ojos && rostroActual && intensidad > 0.06) {
  const aumento = 1 + intensidad * 0.85;
  const radio = Math.max(9, rostroActual.ancho * 0.145);
  for (const ojo of ojos) {
   ctx.save();
   ctx.beginPath();
   ctx.ellipse(ojo.x, ojo.y, radio, radio * 0.72, 0, 0, Math.PI * 2);
   ctx.clip();
   // Ampliamos la imagen reflejada tomando una zona más pequeña del buffer.
   // buffer: 320x180; pantalla: 640x360.
   const rx = radio / aumento;
   const ry = radio * 0.72 / aumento;
   const sx = (ojo.x - rx) / 2;
   const sy = (ojo.y - ry) / 2;
   const sw = rx;
   const sh = ry;
   if (sx >= 0 && sy >= 0 && sx + sw <= buffer.width && sy + sh <= buffer.height) {
    ctx.drawImage(buffer, sx, sy, sw, sh,
      ojo.x - radio, ojo.y - radio * 0.72, radio * 2, radio * 1.44);
   }
   ctx.restore();
  }
 }

 // MAQUILLAJE V7: sombras difuminadas, colorete y labios siguiendo la anatomía.
 // Los colores son deliberadamente piel/rosa/ciruela; el tinte verde de cámara permanece suave.
 const puntosMaquillaje=window.faceMakeupPoints;
 if (puntosMaquillaje && maquillajeSuave>0.02) {
  const P=id=>({x:(1-puntosMaquillaje[id].x)*w,y:puntosMaquillaje[id].y*h});
  const difuminar=(centro,rx,ry,r,g,b,opacidad)=>{
   ctx.save();ctx.translate(centro.x,centro.y);ctx.scale(rx,ry);
   const grad=ctx.createRadialGradient(0,0,.05,0,0,1);
   grad.addColorStop(0,`rgba(${r},${g},${b},${opacidad*maquillajeSuave})`);
   grad.addColorStop(.48,`rgba(${r},${g},${b},${opacidad*.48*maquillajeSuave})`);
   grad.addColorStop(1,`rgba(${r},${g},${b},0)`);
   ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,1,0,Math.PI*2);ctx.fill();ctx.restore();
  };
  const eyePairs=[[33,133,159,145],[362,263,386,374]];
  // Sombras sobre los párpados; no se dibujan polígonos opacos.
  for(const [a,z,top,bottom] of eyePairs){
   const p=P(a),q=P(z),up=P(top),lo=P(bottom);
   const cx=(p.x+q.x)/2, cy=up.y-4;
   const rx=Math.hypot(q.x-p.x,q.y-p.y)*.67;
   difuminar({x:cx,y:cy},rx,Math.max(8,Math.abs(lo.y-up.y)*1.65),111,51,83,.38);
   // Delineado fino a lo largo de los dos extremos del párpado superior.
   ctx.save();ctx.strokeStyle=`rgba(58,23,47,${maquillajeSuave*.68})`;
   ctx.lineWidth=1.35;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.x,p.y);
   ctx.quadraticCurveTo(up.x,up.y-3,q.x,q.y);ctx.stroke();ctx.restore();
  }
  // Colorete con bordes degradados; se adapta al tamaño real del rostro.
  const mejillaIzq=P(117),mejillaDer=P(346),ojoIzq=P(33),ojoDer=P(263);
  const anchoReferencia=Math.max(30,Math.abs(ojoIzq.x-ojoDer.x));
  for(const c of [mejillaIzq,mejillaDer])difuminar(c,anchoReferencia*.26,anchoReferencia*.17,188,88,105,.34);
  // Labial: contorno preciso de los labios y recorte de la abertura de la boca.
  const labioExt=[61,40,37,0,267,270,291,321,314,17,84,91];
  const labioInt=[78,81,13,311,308,402,14,178];
  ctx.save();ctx.beginPath();
  for(const [i,id] of labioExt.entries()){const p=P(id);if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);}ctx.closePath();
  for(const [i,id] of labioInt.entries()){const p=P(id);if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);}ctx.closePath();
  ctx.fillStyle=`rgba(152,50,80,${maquillajeSuave*.43})`;ctx.fill('evenodd');
  ctx.restore();
  // Brillo leve sobre el labio inferior, no sobre toda la cara.
  const labioBrillo=P(17);difuminar({x:labioBrillo.x,y:labioBrillo.y-3},anchoReferencia*.14,3,255,192,178,.17);
 }

 // Puño: pixelación local y retratos con diferentes tratamientos de imagen.
 const objetivoPunio=!!window.fistClosed || fistManual;
 punioSuave+=(Number(objetivoPunio)-punioSuave)*0.09;
 if(rostroActual && punioSuave>0.035){
  const cara=rostroActual;
  const x=Math.max(0,Math.floor(cara.x)), y=Math.max(0,Math.floor(cara.y));
  const cw=Math.min(w-x,Math.ceil(cara.ancho)), ch=Math.min(h-y,Math.ceil(cara.alto));
  if(cw>15&&ch>15){
   // Pixelar solo la región facial. Fuente: fotograma reflejado de baja resolución.
   const escala=1-punioSuave*.88;
   const pixelW=Math.max(7,Math.round(cw*escala/8));
   const pixelH=Math.max(7,Math.round(ch*escala/8));
   caraPixel.width=pixelW;caraPixel.height=pixelH;
   const cp=caraPixel.getContext('2d');cp.clearRect(0,0,pixelW,pixelH);
   cp.drawImage(buffer,x/2,y/2,cw/2,ch/2,0,0,pixelW,pixelH);
   ctx.save();ctx.imageSmoothingEnabled=false;
   ctx.globalAlpha=Math.min(1,punioSuave*1.7);ctx.drawImage(caraPixel,0,0,pixelW,pixelH,x,y,cw,ch);
   ctx.restore();
   // El efecto se despliega escalonadamente, y las posiciones permanecen estables.
   const cantidad=Math.min(12,Math.floor(punioSuave*12));
   const t=performance.now()*.001;
   const estilos=['contrast(185%) grayscale(1)','sepia(1) contrast(190%)','invert(1) contrast(170%)',
      'saturate(250%) hue-rotate(110deg)','contrast(260%) brightness(145%)','grayscale(1) brightness(65%)',
      'sepia(1) hue-rotate(65deg) contrast(190%)','invert(1) hue-rotate(160deg)','contrast(230%) saturate(0)'];
   ctx.save();
   for(let i=0;i<cantidad;i++){
    const col=i%4, fila=Math.floor(i/4);
    const anchoRetrato=105+(i%3)*9,altoRetrato=112+(i%2)*12;
    const xx=8+col*149+Math.sin(t*.7+i*1.7)*5;
    const yy=19+fila*110+Math.cos(t*.6+i*2)*4;
    const deformX=1+(i%4-1.5)*.17, deformY=1+(i%3-1)*.14;
    ctx.save();ctx.translate(xx+anchoRetrato/2,yy+altoRetrato/2);
    ctx.rotate((i%5-2)*.045*punioSuave);
    ctx.globalAlpha=.3+punioSuave*.63;
    ctx.fillStyle='rgba(1,8,3,.86)';ctx.fillRect(-anchoRetrato/2-3,-altoRetrato/2-3,anchoRetrato+6,altoRetrato+6);
    ctx.beginPath();ctx.rect(-anchoRetrato/2,-altoRetrato/2,anchoRetrato,altoRetrato);ctx.clip();
    ctx.filter=estilos[i%estilos.length];ctx.imageSmoothingEnabled=(i%3!==0);
    ctx.drawImage(buffer,x/2,y/2,cw/2,ch/2,
     -anchoRetrato*deformX/2 +Math.sin(t*2+i)*3,-altoRetrato*deformY/2,
